name: Android Build

# Manual only — trigger from the Actions tab (or `gh workflow run`). No push/pull_request
# triggers, so this never runs on its own; you decide when a build happens.
on:
  workflow_dispatch:

permissions:
  contents: write # needed to create/update the debug-latest release below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run :core unit tests
        run: ./gradlew :core:test

      - name: Run :app unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lint

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: temp0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Also publish the raw .apk on a rolling "debug-latest" release, so it can be
      # downloaded and installed directly — no unzip step, unlike the workflow artifact
      # above (which GitHub always wraps in a zip).
      - name: Publish debug APK to the debug-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Latest debug APK — built from commit ${{ github.sha }} on $(date -u +%Y-%m-%dT%H:%M:%SZ). Not signed for release; install with 'unknown sources' allowed."
          if gh release view debug-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload debug-latest app/build/outputs/apk/debug/app-debug.apk \
              --repo "${{ github.repository }}" --clobber
            gh release edit debug-latest --repo "${{ github.repository }}" --notes "$NOTES"
          else
            gh release create debug-latest app/build/outputs/apk/debug/app-debug.apk \
              --repo "${{ github.repository }}" \
              --title "TEMP0 debug APK (latest)" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi
